<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Planificar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B50C8}a:hover{color:#1E3A96}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; color: #1C2333; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #1C2333; color: #FFFFFF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #C5CAD6; font-weight: 600">PLANTILLAS DE PLANIFICACIÓN</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px">Planificar mi clase</h1>
</header>
<main style="flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">

<div role="group" aria-label="Plantilla" style="display: flex; gap: 6px; overflow-x: auto; flex: none">
<sc-for list="{{tpls}}" as="t" hint-placeholder-count="3"><button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<b style="font-size: 15px">{{cur}}</b>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600">Grado<select style="height: 44px; border-radius: 10px; border: 1px solid #D6D3C9; padding: 0 8px; font: 400 14px Inter, sans-serif; background: #FFFFFF"><option>5.º</option></select></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600">Unidad<select style="height: 44px; border-radius: 10px; border: 1px solid #D6D3C9; padding: 0 8px; font: 400 14px Inter, sans-serif; background: #FFFFFF"><option>My community</option></select></label>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600">Intención pedagógica<textarea rows="2" placeholder="¿Qué lograrán los estudiantes?" style="border: 1px solid #D6D3C9; border-radius: 10px; padding: 10px; font: 400 14px Inter, sans-serif"></textarea></label>
<sc-for list="{{moments}}" as="m" hint-placeholder-count="3">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600"><span><span style="{{m.dot}}"></span>{{m.t}} · {{m.min}}</span><textarea rows="2" placeholder="{{m.ph}}" style="border: 1px solid #D6D3C9; border-radius: 10px; padding: 10px; font: 400 14px Inter, sans-serif"></textarea></label>
</sc-for>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600">Recursos<input placeholder="Flashcards, canción, ficha…" style="height: 44px; box-sizing: border-box; border: 1px solid #D6D3C9; border-radius: 10px; padding: 0 10px; font: 400 14px Inter, sans-serif"></label>
</div>
<div style="display: flex; gap: 8px; flex: none">
<button style="flex: 1; height: 48px; border-radius: 12px; border: 1px solid #D6D3C9; background: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Descargar Word</button>
<button style="flex: 1; height: 48px; border-radius: 12px; border: none; background: #2B50C8; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Enviar a la técnica</button>
</div>
</main>
<nav aria-label="Secciones del taller" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; background: #FFFFFF; border-top: 1px solid #E4E2DA; padding: 6px 6px 14px">
<a href="Inicio.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Inicio</a>
<a href="Recursos.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Recursos</a>
<a href="Planificar.dc.html" aria-current="page" style="height: 48px; border-radius: 10px; background: #E8EDFB; color: #1E3A96; font-size: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Planificar</a>
<a href="Fotos.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Fotos</a>
<a href="Encuesta.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Encuesta</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { t: 1 }; }
  renderVals() {
    const names = ['Plan de unidad', 'Plan de clase', 'Secuencia didáctica'];
    const t = this.state.t;
    const tpls = names.map((label, i) => ({ label, on: i === t ? 'true' : 'false', pick: () => this.setState({ t: i }),
      style: 'flex: none; height: 40px; padding: 0 14px; border-radius: 20px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (i === t ? 'border: none; background: #1C2333; color: #FFFFFF' : 'border: 1px solid #D6D3C9; background: #FFFFFF; color: #1C2333') }));
    const moments = [['Inicio', '10 min', 'Saludo, canción, activar saberes previos', '#2B50C8'], ['Desarrollo', '25 min', 'Presentación, práctica en parejas, juego', '#D9622B'], ['Cierre', '10 min', 'Reflexión, evaluación rápida (exit ticket)', '#1B8A6B']]
      .map(([tt, min, ph, c]) => ({ t: tt, min, ph, dot: 'display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: ' + c }));
    return { tpls, cur: names[t], moments };
  }
}
</script>
</body>
</html>
