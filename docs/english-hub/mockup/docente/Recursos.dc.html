<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recursos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B50C8}a:hover{color:#1E3A96}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F0; color: #1C2333; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #1C2333; color: #FFFFFF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #C5CAD6; font-weight: 600">MATERIALES PARA TU CLASE</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px">Recursos</h1>
</header>
<main style="flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">

<div role="group" aria-label="Grado" style="display: flex; gap: 6px">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="3"><button onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.style}}">{{g.label}}</button></sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 14px; padding: 14px; display: flex; gap: 12px">
<div style="{{cover}}"><span style="font-size: 9px; font-weight: 700">ENGLISH</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">{{g}}</span></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px"><b style="font-size: 14px">Libro de {{g}} grado</b><span style="font-size: 12px; color: #5B6170">Libro del estudiante, guía y audios</span><button style="margin-top: auto; height: 40px; border-radius: 10px; border: none; background: #1C2333; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Abrir libro</button></div>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Por unidad</h2>
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><b style="font-size: 14px">{{u.t}}</b><span style="font-size: 12px; color: #5B6170">{{u.tag}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #E8EDFB; color: #1E3A96">Planificación</span>
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #FCEBE1; color: #8F3A14">Flashcards</span>
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #E6F2EE; color: #1B5E4C">Canción</span>
<span style="font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: #FBF3D5; color: #6B5410">Juego</span>
</div>
</div>
</sc-for>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Del taller de hoy</h2>
<div style="background: #FFFFFF; border: 1px solid #E4E2DA; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 10px"><span style="font-size: 10px; font-weight: 700; background: #E8EDFB; color: #1E3A96; padding: 4px 6px; border-radius: 5px">PDF</span><span style="flex: 1; font-size: 14px; font-weight: 500">Guía de dinámicas y juegos</span><button aria-label="Descargar guía" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #E4E2DA; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C2333" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button></div>
</main>
<nav aria-label="Secciones del taller" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; background: #FFFFFF; border-top: 1px solid #E4E2DA; padding: 6px 6px 14px">
<a href="Inicio.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Inicio</a>
<a href="Recursos.dc.html" aria-current="page" style="height: 48px; border-radius: 10px; background: #E8EDFB; color: #1E3A96; font-size: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Recursos</a>
<a href="Planificar.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Planificar</a>
<a href="Fotos.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Fotos</a>
<a href="Encuesta.dc.html" style="height: 48px; border-radius: 10px; color: #5B6170; font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Encuesta</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { g: '5.º' }; }
  renderVals() {
    const data = { '4.º': ['My school', 'My family', 'Daily routines'], '5.º': ['My community', 'Food and health', 'Weather and seasons'], '6.º': ['Jobs and occupations', 'Free time', 'Places in my country'] };
    const cols = { '4.º': ['#2B50C8', '#FFFFFF'], '5.º': ['#D9622B', '#1C2333'], '6.º': ['#1B8A6B', '#FFFFFF'] };
    const g = this.state.g;
    const grades = ['4.º', '5.º', '6.º'].map((label) => ({ label: label + ' grado', on: label === g ? 'true' : 'false', pick: () => this.setState({ g: label }),
      style: 'flex: 1; height: 44px; border-radius: 22px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (label === g ? 'border: none; background: #1C2333; color: #FFFFFF' : 'border: 1px solid #D6D3C9; background: #FFFFFF; color: #1C2333') }));
    return { grades, g, units: data[g].map((t, i) => ({ t, tag: 'Unidad ' + (i + 1) })),
      cover: 'width: 70px; height: 96px; flex: none; border-radius: 6px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; background: ' + cols[g][0] + '; color: ' + cols[g][1] };
  }
}
</script>
</body>
</html>
