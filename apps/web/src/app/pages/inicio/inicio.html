<section class="bg-white">
  <div class="contenedor py-14 sm:py-20">
    <p class="text-sm font-semibold uppercase tracking-wide text-acento">Nivel Secundario</p>
    <h1 class="mt-2 max-w-2xl text-4xl font-bold leading-tight sm:text-5xl">Tecnología al servicio de tu clase</h1>
    <p class="mt-4 max-w-xl text-lg text-secundario">
      Recursos, robótica educativa y acompañamiento TIC para los docentes del centro.
    </p>
    @if (!auth.usuario()) {
      <div class="mt-8 flex flex-wrap gap-3">
        <a routerLink="/login" class="btn btn-primario">Entrar o crear cuenta</a>
      </div>
    } @else {
      <p class="mt-8 text-secundario">Hola, {{ auth.perfil()?.nombre ?? auth.usuario()?.email }}.</p>
    }
  </div>
</section>
